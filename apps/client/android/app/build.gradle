apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.devtools.ksp'

def envOr = { String k, String d -> System.getenv(k) ?: (project.findProperty(k) ?: d) }

android {
    namespace = "in.tinkercraft.tinkerspend"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.tinkercraft.tinkerspend"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(envOr('TS_VERSION_CODE', '1'))
        versionName envOr('TS_VERSION_NAME', '0.1.0')
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${envOr('GOOGLE_WEB_CLIENT_ID', '')}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    signingConfigs {
        debug {
            def dk = envOr('TS_DEBUG_KEYSTORE', '')
            if (dk) { storeFile file(dk); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
        }
        release {
            def rk = envOr('TS_RELEASE_KEYSTORE', '')
            if (rk) { storeFile file(rk); storePassword System.getenv('ANDROID_RELEASE_KEYSTORE_PASSWORD'); keyAlias 'tinkerspend'; keyPassword System.getenv('ANDROID_RELEASE_KEYSTORE_PASSWORD') }
        }
    }
    buildTypes {
        debug {
            buildConfigField "String", "API_BASE_URL", "\"${envOr('TS_API_BASE_URL_DEBUG', 'https://expenses.tinkercraft.in')}\""
            buildConfigField "boolean", "ALLOW_FIXTURE_SOURCE", "true"
        }
        release {
            buildConfigField "String", "API_BASE_URL", "\"${envOr('TS_API_BASE_URL', 'https://expenses.tinkercraft.in')}\""
            buildConfigField "boolean", "ALLOW_FIXTURE_SOURCE", "false"
            if (envOr('TS_RELEASE_KEYSTORE', '')) signingConfig signingConfigs.release
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.room:room-runtime:2.8.4"
    ksp "androidx.room:room-compiler:2.8.4"
    implementation "androidx.work:work-runtime:2.11.2"
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    testImplementation "org.json:json:20250517"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
