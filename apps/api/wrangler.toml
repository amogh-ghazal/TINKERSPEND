# Cloudflare Workers FREE + D1 FREE only. Do not enable Workers Paid, R2, Queues, Durable Objects with billing, or Logpush.
name = "tinkerspend-staging"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../client/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tinkerspend-staging"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
APP_ENV = "staging"
ALLOWED_ORIGINS = "http://localhost:5173"
GOOGLE_WEB_CLIENT_ID = ""
OPENAI_TRANSCRIBE_MODEL = "gpt-4o-mini-transcribe"
OPENAI_EXTRACT_MODEL = "gpt-4.1-mini"
AI_DAILY_GLOBAL_LIMIT = "100"
AI_USER_CLASSIFY_LIMIT = "50"
SESSION_DAYS = "30"
AUTH_CHALLENGE_DAILY_LIMIT = "1000"

[env.production]
name = "tinkerspend"
workers_dev = false
routes = []
[env.production.vars]
APP_ENV = "production"
ALLOWED_ORIGINS = "https://expenses.tinkercraft.in"
GOOGLE_WEB_CLIENT_ID = ""
OPENAI_TRANSCRIBE_MODEL = "gpt-4o-mini-transcribe"
OPENAI_EXTRACT_MODEL = "gpt-4.1-mini"
AI_DAILY_GLOBAL_LIMIT = "100"
AI_USER_CLASSIFY_LIMIT = "50"
SESSION_DAYS = "30"
AUTH_CHALLENGE_DAILY_LIMIT = "1000"
[[env.production.d1_databases]]
binding = "DB"
database_name = "tinkerspend-prod"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
